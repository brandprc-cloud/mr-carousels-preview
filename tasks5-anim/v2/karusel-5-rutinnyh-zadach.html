<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карусель — превью и экспорт</title>
<!-- ═══════════════════════ ДИЗАЙН-КОД · ШРИФТЫ ═══════════════════════
     Нейросеть-ассистент меняет строку ниже на выбранную пару Google Fonts (кириллица!). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════ ДИЗАЙН-КОД · ТОКЕНЫ ═══════════════════════
   Единственное место, где живёт фирменный стиль. Ассистент меняет ТОЛЬКО этот блок
   (и блок шрифтов выше). Болванка поставляется в нейтральных серых цветах. */
:root{
  --brand:  "mr.brezgin"; /* имя бренда — показывается в шапке превью */
  --paper:  #F2F3F5;   /* основной светлый фон слайдов */
  --ink:    #0E1116;   /* текст на светлом; фон тёмных слайдов */
  --accent: #5B82FF;   /* фирменный акцент: выделения, кнопки, фон акцент-слайда */
  --accent2:#D1DCFF;   /* акцент на акцентном фоне (жёлтый у оранжевого и т.п.) */
  --muted:  #75777A;   /* вторичный текст: номера, подписи — только на светлом */
  --font-head: 'Manrope', sans-serif;   /* заголовочный */
  --font-body: 'Inter', sans-serif;    /* текстовый */
  --head-transform: uppercase;  /* uppercase | none — заголовки капсом или как написано */
  --head-track: -0.01em;        /* трекинг заголовков */
  --head-lh: 1.04;              /* межстрочный интервал заголовков: 1.02–1.06 для узкой кириллицы капсом, 1.1–1.14 для широкой (Unbounded, Montserrat) (иначе Й и Ё налезают на строку выше), 1–1.08 для антикв */
  --radius: 32px;               /* скругление внутренних блоков (сам слайд всегда острый) */
}
/* ══════════════════════ КОНЕЦ ДИЗАЙН-КОДА ══════════════════════ */

*{box-sizing:border-box;margin:0}
body{margin:0;background:#3c3c39;font-family:var(--font-body)}

/* ---------- холст слайда: 1080×1350, поля 96, safe-зоны 135/150 ---------- */
.art{width:1080px;height:1350px;position:relative;display:flex;flex-direction:column;
  padding:150px 96px;font-family:var(--font-body);overflow:hidden;flex-shrink:0}
.hl{font-family:var(--font-head);font-weight:600;letter-spacing:var(--head-track);
  text-transform:var(--head-transform);line-height:var(--head-lh)}

/* шкала заголовков (исходник Алекса): лестница автоужимания идёт по этим классам */
.h0{font-size:220px}.h0-photo{font-size:180px}.h0-sm{font-size:180px}.h0-xs{font-size:150px}.h0-xxs{font-size:118px}
.h1{font-size:132px}.h1-sm{font-size:104px}.h1-xs{font-size:88px}.h1-xxs{font-size:76px}
.lead{font-size:54px;line-height:1.25;font-weight:500;margin-top:48px}
.body{font-size:48px;line-height:1.45;margin-top:56px}.body+.body{margin-top:32px}
.body b{font-weight:600}
.swipe{font-size:44px;font-weight:500;margin-top:auto}
.foot{position:absolute;left:96px;right:96px;bottom:64px;display:flex;
  justify-content:space-between;align-items:baseline;font-size:31px}
.nofoot{padding-bottom:80px}

/* ---------- цветовые роли слайдов ---------- */
.s-paper{background:var(--paper);color:var(--ink)}
.s-paper .foot{color:var(--muted)}
.s-paper .acc,.s-paper .body b{color:var(--accent)}
.s-ink{background:var(--ink);color:var(--paper)}
.s-ink .foot{color:color-mix(in srgb,var(--paper) 55%,transparent)}
.s-ink .acc,.s-ink .body b{color:var(--accent)}
.s-accent{background:var(--accent);color:var(--paper)}
.s-accent .foot{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.s-accent .acc,.s-accent .body b{color:var(--accent2)}
.s-photo{background-size:cover;background-position:center;color:var(--paper)}
.s-photo.scrim::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.46),rgba(0,0,0,.34) 40%,transparent 68%)}
.s-photo>*{position:relative}.s-photo>.plx{position:absolute;inset:-7%;background-size:cover;background-position:center;will-change:transform}.s-photo>.foot{position:absolute}
.s-photo-dark{color:var(--ink)}.s-photo-dark .acc{color:var(--accent)}
.s-photo-dark.scrim::before{background:linear-gradient(0deg,
  color-mix(in srgb,var(--paper) 85%,transparent) 0%,
  color-mix(in srgb,var(--paper) 55%,transparent) 30%,transparent 55%)}
/* на акцентном фоне акцент-цветные элементы переключаются на второй акцент */
.s-accent .qmark,.s-accent .step-eyebrow,.s-accent .bignum,.s-accent .numlist .n,
.s-accent .truth-label,.s-accent .term-tag,.s-accent .tl .lbl,.s-accent .formula .op,
.s-accent .rating .val,.s-accent .faq .q::before,.s-accent .recap .n{color:var(--accent2)}
.s-accent .dots i.on,.s-accent .tl .pt,.s-accent .rating .fill,.s-accent .save-mark,
.s-accent .check .box.done{background:var(--accent2)}
.s-accent .check .box{border-color:var(--accent2)}
.s-accent .quotebox{border-color:var(--accent2)}
.s-accent .btn{background:var(--paper);color:var(--ink)}
.s-accent .myth-tag{text-decoration-color:var(--accent2)}

/* ---------- элементы ---------- */
.callout{margin-top:48px;border-radius:var(--radius);padding:44px 56px;
  border:3px solid color-mix(in srgb,var(--accent) 30%,transparent);
  background:color-mix(in srgb,var(--accent) 6%,transparent)}
.callout .ct{font-size:34px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:32px}
.btn{display:inline-block;margin-top:36px;padding:24px 42px;border-radius:22px;
  background:var(--accent);color:var(--paper);font-size:40px;font-weight:600;
  line-height:1.25;align-self:flex-start}
.btn .ex{font-weight:400;opacity:.85}
.btn .dm{display:block;font-weight:400;font-size:36px;margin-top:16px;opacity:.85}
.inside{font-size:40px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  margin-top:40px;opacity:.6}
.bullets{margin-top:24px;display:flex;flex-direction:column;gap:24px}
.bullets p{font-size:40px;line-height:1.3;padding-left:66px;position:relative}
.bullets p::before{content:"—";position:absolute;left:0;color:var(--accent);font-weight:600}
.s-accent .bullets p::before{color:var(--accent2)}
.step-eyebrow{font-family:var(--font-head);font-size:72px;line-height:1;color:var(--accent);
  text-transform:var(--head-transform)}
.dots{display:flex;gap:18px;margin:28px 0 44px}
.dots i{width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,currentColor 15%,transparent)}
.dots i.on{background:var(--accent)}
.bignum{font-family:var(--font-head);font-size:460px;line-height:.85;color:var(--accent);margin-top:40px;white-space:nowrap}
.bignum-cap{font-size:56px;line-height:1.25;font-weight:500;margin-top:40px;max-width:20ch}
.bignum-src{font-size:31px;color:var(--muted);margin-top:40px}
.ba{display:flex;flex-direction:column;gap:36px;margin-top:64px}
.ba-block{border-radius:var(--radius);padding:52px 60px}
.ba-label{font-size:34px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px;opacity:.6}
.ba-text{font-size:44px;line-height:1.35}
.ba-was{background:var(--ink);color:var(--paper)}
.ba-now{background:var(--accent);color:var(--paper)}
.qmark{font-family:var(--font-head);font-size:300px;line-height:.55;color:var(--accent);height:150px}
.qtext{font-size:62px;line-height:1.3;font-weight:500;margin-top:40px}
.qwho{font-size:40px;margin-top:56px;opacity:.6}.qwho b{opacity:1}
.myth-tag{font-family:var(--font-head);font-size:76px;line-height:1;color:var(--muted);
  text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:7px;
  margin-bottom:40px;text-transform:var(--head-transform)}
.myth-quote{font-size:58px;line-height:1.25;font-weight:500}
.truth-label{font-size:40px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);margin-top:88px}
.truth-text{font-size:48px;line-height:1.45;margin-top:28px}
.numlist{display:flex;flex-direction:column;gap:48px;margin-top:72px}
.numlist .row{display:flex;gap:40px;align-items:center}
.numlist .n{font-family:var(--font-head);font-size:84px;line-height:1;color:var(--accent);min-width:100px}
.numlist .t{font-size:46px;line-height:1.35}
.code-slab{margin-top:56px;background:var(--ink);border-radius:var(--radius);padding:52px 56px;position:relative}
.s-ink .code-slab{background:color-mix(in srgb,var(--paper) 8%,transparent);
  border:2px solid color-mix(in srgb,var(--paper) 20%,transparent)}
.code-slab .cdots{display:flex;gap:14px;margin-bottom:36px}
.code-slab .cdots i{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.18)}
.code-slab .cdots i:first-child{background:var(--accent)}
.code-slab pre{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;font-size:36px;
  line-height:1.55;color:var(--paper);white-space:pre-wrap}
.code-slab pre .c{opacity:.45}.code-slab pre .hot{color:var(--accent2)}
.part-badge{position:absolute;top:44px;right:56px;font-family:ui-monospace,monospace;
  font-size:30px;color:var(--accent);letter-spacing:.08em}
.prompt-note{font-size:38px;line-height:1.4;color:var(--muted);margin-top:32px}
.media-zone{margin-top:56px;flex:1;border-radius:var(--radius);background:#fff;
  border:3px solid rgba(0,0,0,.08);box-shadow:0 24px 64px -24px rgba(0,0,0,.28);
  overflow:hidden;display:flex}
.media-zone img{width:100%;height:100%;object-fit:cover}
.chart{display:grid;grid-template-columns:210px 1fr;row-gap:28px;align-items:center}
.chart .lbl{font-size:38px;font-weight:500}
.chart .bar{height:40px;border-radius:20px;background:currentColor;opacity:.3}
.chart .bar.hot{background:var(--accent);opacity:1}
.quotebox{margin-top:44px;border-left:8px solid var(--accent);padding-left:40px;
  font-size:38px;line-height:1.45;opacity:.85;font-style:italic}
.pat{margin-top:36px}
.pat .bad{font-size:42px;line-height:1.3;font-weight:600;padding-left:60px;position:relative}
.pat .bad::before{content:"✕";position:absolute;left:0;color:var(--accent);font-weight:700}
.pat .why{font-size:34px;line-height:1.3;color:var(--muted);margin-top:12px;padding-left:60px}
.pat .good{font-size:38px;line-height:1.32;margin-top:16px;padding-left:60px;position:relative}
.pat .good::before{content:"✓";position:absolute;left:0;font-weight:700}
.pat .good i{color:var(--muted);font-style:italic;font-size:34px}
.dense .body{font-size:42px;line-height:1.38;margin-top:36px}.dense .body+.body{margin-top:24px}
/* --- новые типы --- */
.check{margin-top:64px;display:flex;flex-direction:column;gap:40px}
.check .row{display:flex;gap:36px;align-items:flex-start}
.check .box{width:56px;height:56px;flex-shrink:0;border-radius:14px;
  border:5px solid var(--accent);margin-top:4px;position:relative}
.check .box.done{background:var(--accent)}
.check .box.done::after{content:"";position:absolute;inset:12px 10px 16px;
  border-left:6px solid var(--paper);border-bottom:6px solid var(--paper);transform:rotate(-48deg)}
.check .t{font-size:46px;line-height:1.35}
.vs{display:flex;flex-direction:column;gap:32px;margin-top:64px;flex:1}
.vs-col{border-radius:var(--radius);padding:44px 52px;flex:1;display:flex;flex-direction:column;justify-content:center}
.vs-col.left{background:color-mix(in srgb,var(--ink) 7%,transparent);
  border:3px solid color-mix(in srgb,var(--ink) 15%,transparent)}
.vs-col.right{background:var(--ink);color:var(--paper)}
.vs-label{font-size:34px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:28px;opacity:.6}
.vs-item{font-size:40px;line-height:1.35;padding-left:58px;position:relative;margin-top:22px}
.vs-item::before{content:"—";position:absolute;left:0;color:var(--accent);font-weight:600}
.thought-wrap{flex:1;display:flex;flex-direction:column;justify-content:center}
.thought{font-family:var(--font-head);font-size:120px;line-height:1.04;
  text-transform:var(--head-transform);letter-spacing:var(--head-track)}
.thought-note{font-size:46px;line-height:1.4;margin-top:56px;opacity:.75;max-width:22ch}
.faq{margin-top:56px;display:flex;flex-direction:column;gap:56px}
.faq .q{font-size:48px;line-height:1.3;font-weight:600;padding-left:70px;position:relative}
.faq .q::before{content:"?";position:absolute;left:0;top:-6px;font-family:var(--font-head);
  font-size:64px;color:var(--accent)}
.faq .a{font-size:42px;line-height:1.4;margin-top:20px;padding-left:70px;opacity:.9}
.term-tag{font-size:36px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.term{font-family:var(--font-head);font-size:130px;line-height:.98;margin-top:36px;
  text-transform:var(--head-transform)}
.term-def{font-size:50px;line-height:1.4;margin-top:56px}
.term-note{font-size:38px;line-height:1.4;color:var(--muted);margin-top:40px}
.formula{margin-top:72px;display:flex;flex-wrap:wrap;gap:28px;align-items:center}
.formula .chip{border-radius:24px;padding:28px 40px;font-size:44px;font-weight:500;
  border:3px solid color-mix(in srgb,var(--ink) 20%,transparent)}
.formula .op{font-family:var(--font-head);font-size:64px;color:var(--accent)}
.formula .chip.res{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tl{margin-top:64px;display:flex;flex-direction:column}
.tl .row{display:flex;gap:44px;position:relative;padding-bottom:56px}
.tl .row:last-child{padding-bottom:0}
.tl .row::before{content:"";position:absolute;left:17px;top:44px;bottom:0;width:6px;
  background:color-mix(in srgb,var(--accent) 30%,transparent)}
.tl .row:last-child::before{display:none}
.tl .pt{width:40px;height:40px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px}
.tl .lbl{font-family:var(--font-head);font-size:44px;color:var(--accent);
  text-transform:var(--head-transform);margin-bottom:10px}
.tl .t{font-size:42px;line-height:1.35}
.save-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.save-mark{width:88px;height:116px;background:var(--accent);margin-bottom:56px;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%)}
.rating{margin-top:72px;display:flex;flex-direction:column;gap:52px}
.rating .lbl{font-size:44px;font-weight:500;margin-bottom:22px}
.rating .track{height:22px;border-radius:11px;background:color-mix(in srgb,currentColor 14%,transparent);position:relative}
.rating .fill{position:absolute;left:0;top:0;bottom:0;border-radius:11px;background:var(--accent)}
.rating .val{font-family:var(--font-head);font-size:40px;color:var(--accent);margin-top:14px}
.testi{margin-top:56px;border-radius:var(--radius);padding:56px 60px;
  background:color-mix(in srgb,var(--ink) 6%,transparent);
  border:3px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.s-ink .testi,.s-accent .testi{background:color-mix(in srgb,var(--paper) 8%,transparent);
  border-color:color-mix(in srgb,var(--paper) 22%,transparent)}
.testi .tx{font-size:46px;line-height:1.4}
.testi .who{font-size:38px;margin-top:36px;opacity:.65}
.recap{margin-top:64px;display:flex;flex-direction:column;gap:36px}
.recap .row{display:flex;gap:36px;align-items:flex-start}
.recap .n{font-family:var(--font-head);font-size:52px;line-height:1.1;color:var(--accent);min-width:66px}
.recap .t{font-size:44px;line-height:1.35}


/* ═══ ПРЕДМЕТНЫЕ ЭЛЕМЕНТЫ (виджеты) ═══
   Плоские UI-объекты под смысл слайда: шаги, файлы, чат, телефон, окно, схема, хаб, выбор, ссылка, карточка.
   Рисуются ТОЛЬКО токенами стиля: поверхность --sf, линия --ln, текст --fg, акцент --ac. Без рукописных
   элементов, стикеров и скотча — так виджеты одинаково ложатся в любой пресет и в свой стиль. */
.s-paper{--sf:color-mix(in srgb,var(--ink) 6%,var(--paper));--sf2:color-mix(in srgb,var(--ink) 11%,var(--paper));--ln:color-mix(in srgb,var(--ink) 14%,transparent);--fg:var(--ink);--ac:var(--accent);--acfg:var(--paper);--mu:var(--muted)}
.s-ink{--sf:color-mix(in srgb,var(--paper) 9%,var(--ink));--sf2:color-mix(in srgb,var(--paper) 16%,var(--ink));--ln:color-mix(in srgb,var(--paper) 20%,transparent);--fg:var(--paper);--ac:var(--accent);--acfg:var(--paper);--mu:color-mix(in srgb,var(--paper) 60%,transparent)}
.s-accent{--sf:color-mix(in srgb,var(--paper) 14%,var(--accent));--sf2:color-mix(in srgb,var(--paper) 24%,var(--accent));--ln:color-mix(in srgb,var(--paper) 30%,transparent);--fg:var(--paper);--ac:var(--accent2);--acfg:var(--accent);--mu:color-mix(in srgb,var(--paper) 70%,transparent)}
.s-photo{--sf:rgba(255,255,255,.14);--sf2:rgba(255,255,255,.22);--ln:rgba(255,255,255,.3);--fg:var(--paper);--ac:var(--accent);--acfg:var(--paper);--mu:rgba(255,255,255,.7)}
.save-wrap{flex:0 1 auto!important;margin:auto 0}
h2.hl:empty{display:none}
h2.hl:empty+.body{margin-top:0}
.wg{margin-top:44px;flex-shrink:0;position:relative;font-family:var(--font-body);color:var(--fg)}
.wg.top{margin-top:40px;margin-bottom:44px}
.wcard{background:var(--sf);border:3px solid var(--ln);border-radius:var(--radius)}
/* шаги-лесенка */
.wg-steps{display:flex;align-items:flex-end;gap:14px;height:var(--h,280px)}
.wg-steps .st{flex:1;border-radius:calc(var(--radius) * .7);padding:20px 8px 16px;text-align:center;font-size:26px;font-weight:600;color:var(--fg);background:var(--sf2);display:flex;flex-direction:column;justify-content:flex-start}
.wg-steps .st.on{background:var(--ac);color:var(--acfg)}
.wg-steps .st b{display:block;font-family:var(--font-head);font-size:60px;line-height:1;font-weight:700;margin-bottom:8px}
/* файлы-карточки и чек-строки */
.wg-files{display:flex;flex-direction:column;gap:16px}
.wg-files .fr{display:flex;align-items:center;gap:22px;padding:18px 26px;font-size:36px;line-height:1.3}
.wg-files .fr i{flex-shrink:0;width:40px;height:50px;background:var(--ac);clip-path:polygon(0 0,68% 0,100% 24%,100% 100%,0 100%);border-radius:4px}
.wg-checks{display:flex;flex-direction:column;gap:22px}
.wg-checks .cr{display:block;position:relative;padding-left:74px;font-size:40px;line-height:1.35;min-height:54px}
.wg-checks .cr .ic{position:absolute;left:0;top:2px;width:50px;height:50px;border-radius:50%;background:var(--ac)}
.wg-checks .cr .ic svg{position:absolute;inset:0;width:100%;height:100%}
/* чат */
.wg-chat{display:flex;flex-direction:column;gap:18px}
.wg-chat .m{max-width:86%;padding:28px 36px;font-size:36px;line-height:1.35}
.wg-chat .me{align-self:flex-end;background:var(--ac);color:var(--acfg);border-radius:var(--radius) var(--radius) 8px var(--radius)}
.wg-chat .bot{align-self:flex-start;background:var(--sf);border:3px solid var(--ln);border-radius:var(--radius) var(--radius) var(--radius) 8px}
.wg-chat .who{font-size:26px;color:var(--mu);margin:0 0 -8px 8px}
/* телефон (обрезан нижним краем слайда) */
.art:has(.wg-phone) .foot{display:none}
.wg-phone{height:calc(var(--h,520px) - 150px);margin-top:auto;position:static}
.wg-phone .ph{position:absolute;left:280px;top:calc(1350px - var(--h,520px));width:520px;height:1000px;border-radius:72px;background:var(--fg);padding:16px;z-index:2}
.wg-phone .scr{height:100%;border-radius:58px;background:var(--paper);color:var(--ink);overflow:hidden}
.wg-phone .isl{width:150px;height:38px;border-radius:30px;background:var(--fg);margin:14px auto 0}
.wg-phone .hd{display:flex;align-items:center;gap:16px;padding:18px 26px;border-bottom:3px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.wg-phone .hd i{width:60px;height:60px;border-radius:50%;background:var(--accent);flex-shrink:0}
.wg-phone .hd .nm{font-size:27px;font-weight:600}.wg-phone .hd .sb{font-size:21px;color:var(--muted)}
.wg-phone .msg{margin:16px 22px 0;padding:18px 22px;border-radius:24px;font-size:24px;line-height:1.35;background:color-mix(in srgb,var(--ink) 6%,var(--paper));max-width:88%}
.wg-phone .msg.me{margin-left:auto;background:var(--accent);color:var(--paper)}
.wg-phone .msg .mt{font-size:18px;color:var(--muted);text-align:right;margin-top:6px}
/* окно: браузер / приложение / терминал */
.wg-win{overflow:hidden}
.wg-win .tb{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:3px solid var(--ln)}
.wg-win .tb i{width:20px;height:20px;border-radius:50%;background:var(--ln)}.wg-win .tb i:first-child{background:var(--ac)}
.wg-win .tb .u{margin-left:12px;flex:1;background:var(--sf2);border-radius:999px;padding:8px 22px;font-size:26px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg-win .bd{padding:26px 32px;font-size:32px;line-height:1.4}
.wg-win .bd .ln{display:flex;gap:16px}.wg-win .bd .ln+.ln{margin-top:10px}
.wg-win .bd .lb{font-size:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:0 0 10px}
.wg-win .bd .box{border:3px solid var(--ac);border-radius:calc(var(--radius) * .6);padding:18px 22px;margin-bottom:18px}
.wg-win.term{background:var(--ink);color:var(--paper);border-color:transparent}
.s-ink .wg-win.term{background:var(--paper);color:var(--ink)}
.wg-win.term .bd{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;font-size:30px;line-height:1.55}
.wg-win.term .pr{color:var(--accent);margin-right:14px}
.wg-win.term .cur{display:inline-block;width:16px;height:34px;background:currentColor;vertical-align:-6px;margin-left:8px}
/* схема-поток */
.wg-scheme{display:flex;align-items:stretch;gap:0}
.wg-scheme.col{flex-direction:column}
.wg-scheme .bk{flex:1;padding:22px 20px;text-align:center;font-size:30px;line-height:1.25;font-weight:600;display:flex;align-items:center;justify-content:center}
.wg-scheme .bk.on{background:var(--ac);color:var(--acfg);border-color:transparent}
.wg-scheme .ar{flex:0 0 46px;display:flex;align-items:center;justify-content:center;position:relative}
.wg-scheme .ar svg{width:30px;height:30px;overflow:visible}
.wg-scheme.col .ar{flex-basis:44px}.wg-scheme.col .ar svg{transform:rotate(90deg)}
.wg-scheme.col .bk{text-align:left;justify-content:flex-start;padding:22px 30px;font-size:34px}
/* хаб */
.wg-hub{height:var(--h,400px)}
.wg-hub svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wg-hub .c{position:absolute;left:50%;top:50%;translate:-50% -50%;background:var(--ac);color:var(--acfg);border-radius:calc(var(--radius) * .8);padding:26px 42px;font-size:42px;font-weight:700}
.wg-hub .sv{position:absolute;translate:0 -50%;border-radius:28px;padding:16px 28px;font-size:30px;font-weight:600;max-width:34%;width:max-content;text-align:center;line-height:1.2}
/* выбор в меню */
.wg-pick .menu{width:600px;margin-left:auto;padding:12px}
.wg-pick .it{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 22px;border-radius:calc(var(--radius) * .5);font-size:32px}
.wg-pick .it small{display:block;white-space:nowrap;font-size:22px;line-height:1.2;color:var(--mu);margin-top:4px}
.wg-pick .it{line-height:1.2}
.wg-pick .it.on small{color:inherit;opacity:.8}
.wg-pick .it.on{background:var(--ac);color:var(--acfg);font-weight:700}
.wg-pick .bar{margin-top:14px;padding:16px 26px;display:flex;justify-content:space-between;align-items:center;font-size:30px;color:var(--mu)}
.wg-pick .bar b{color:var(--fg);font-weight:600;border:3px solid var(--ac);border-radius:14px;padding:6px 16px}
/* призыв: кнопка во всю ширину, строки ровные; вариант без кнопки — «Как получить?» текстом */
.art .btn{display:block;align-self:stretch;width:100%;border-radius:calc(var(--radius) * .6);padding:30px 40px;font-size:38px;line-height:1.3}
.art .btn .dm{font-size:32px;margin-top:10px;opacity:.85;line-height:1.3}
.how{margin-top:40px;font-size:40px;line-height:1.4}.how b{color:var(--ac);font-weight:700}
.s-accent .how b{color:var(--accent2)}
/* ссылка-пилюля, карточка файла, прогресс, бейдж, заметка */
.wg-url{display:inline-flex;align-self:flex-start;align-items:center;gap:20px;border-radius:999px;padding:24px 42px 24px 34px;font-size:40px;font-weight:500}
.wg-url svg{width:34px;height:44px;flex-shrink:0}
.wg-doc{display:flex;align-items:center;gap:26px;padding:26px 32px;align-self:flex-start;max-width:100%}
.wg-doc i{flex-shrink:0;width:64px;height:80px;background:var(--ac);clip-path:polygon(0 0,66% 0,100% 26%,100% 100%,0 100%);border-radius:6px}
.wg-doc .t{font-size:38px;font-weight:700;line-height:1.2}.wg-doc .s{font-size:28px;color:var(--mu);margin-top:6px}
.wg-prog .lbl{display:flex;justify-content:space-between;font-size:34px;font-weight:500;margin-bottom:16px}
.wg-prog .tr{height:26px;border-radius:13px;background:var(--sf2);overflow:hidden}
.wg-prog .fl{height:100%;border-radius:13px;background:var(--ac);transform-origin:left center}
.wg-prog+.wg-prog{margin-top:28px}
.badge{position:absolute;right:96px;top:44px;z-index:4;background:var(--ac);color:var(--acfg);border-radius:999px;padding:14px 30px;font-size:30px;font-weight:700;letter-spacing:.02em;max-width:420px;text-align:center;line-height:1.2}
.ntc{margin-top:40px;padding:28px 36px 28px 40px;border-left:10px solid var(--ac);border-radius:0 var(--radius) var(--radius) 0;background:var(--sf);font-size:38px;line-height:1.4}
.ntc b{color:var(--ac)}
.mk{background:color-mix(in srgb,var(--ac) 28%,transparent);padding:0 .12em;border-radius:.2em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.s-accent .mk{background:color-mix(in srgb,var(--paper) 30%,transparent)}
/* скриншот в рамке */
.wg-shot{overflow:hidden}.wg-shot img{display:block;width:100%;height:auto}
.wg-shot.phone-frame{width:560px;margin:0 auto;border-radius:60px;padding:14px;background:var(--fg);border:0}
.wg-shot.phone-frame img{border-radius:48px}
/* ═══ КОНЕЦ ПРЕДМЕТНЫХ ЭЛЕМЕНТОВ ═══ */

.h0-xxxs{font-size:100px}
/* ═══ ПРЕСЕТЫ · ХАРАКТЕР ═══  (графические элементы каждого стиля; включаются классом на <html>) */
.art{--n:0}
/* 1. Технологичный минимализм: тонкие линии, моноширинные номера, пилюли */
.p-tehno-minimalizm .art::before{content:"";position:absolute;left:96px;right:96px;top:104px;height:2px;background:var(--accent);opacity:.9}
.p-tehno-minimalizm .art.s-accent::before{background:var(--paper)}
.p-tehno-minimalizm .foot,.p-tehno-minimalizm .numlist .n,.p-tehno-minimalizm .recap .n,.p-tehno-minimalizm .step-eyebrow{font-family:'JetBrains Mono',monospace;font-weight:500}
.p-tehno-minimalizm .numlist .n{font-size:40px;min-width:90px;padding-top:8px;align-self:flex-start;letter-spacing:.04em}
.p-tehno-minimalizm .numlist .row{align-items:flex-start;border-top:2px solid color-mix(in srgb,var(--ink) 12%,transparent);padding-top:28px}
.p-tehno-minimalizm .numlist{gap:28px}
.p-tehno-minimalizm .swipe{border:2px solid currentColor;border-radius:999px;padding:14px 34px;align-self:flex-start;font-size:36px}
.p-tehno-minimalizm .btn{border-radius:999px}
.p-tehno-minimalizm .hl{font-weight:700}
/* 2. Тёплый журнал: буквица, линейка под заголовком, номера антиквой */
.p-tyoplyj-zhurnal .hl{font-weight:700}
.p-tyoplyj-zhurnal .art:not(.s-photo) h2.hl{padding-bottom:36px;border-bottom:3px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.p-tyoplyj-zhurnal .art.s-accent h2.hl{border-color:color-mix(in srgb,var(--paper) 45%,transparent)}
.p-tyoplyj-zhurnal .art:not(:has(.wg)):not(:has(.save-wrap)) h2+.body::first-letter{font-family:var(--font-head);font-size:150px;line-height:.8;float:left;padding:18px 22px 0 0;color:var(--accent);font-weight:700}
.p-tyoplyj-zhurnal .s-accent h2+.body::first-letter{color:var(--accent2)}
.p-tyoplyj-zhurnal .numlist .n{font-style:italic;font-weight:600;font-size:96px}
.p-tyoplyj-zhurnal .swipe{font-style:italic;font-family:var(--font-head);font-weight:600;font-size:50px}
.p-tyoplyj-zhurnal .foot{font-style:italic;font-family:var(--font-head);font-size:34px}
.p-tyoplyj-zhurnal .btn{border-radius:8px}
/* 3. Ночной неон: свечение акцента, световое пятно в углу */
.p-nochnoj-neon .art{background-image:radial-gradient(60% 45% at 100% 100%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%)}
.p-nochnoj-neon .art.s-ink{background-image:none}
.p-nochnoj-neon .s-paper .acc,.p-nochnoj-neon .s-paper .body b,.p-nochnoj-neon .s-paper .numlist .n,.p-nochnoj-neon .s-paper .step-eyebrow{text-shadow:0 0 28px color-mix(in srgb,var(--accent) 65%,transparent)}
.p-nochnoj-neon .btn{box-shadow:0 0 48px color-mix(in srgb,var(--accent) 55%,transparent)}
.p-nochnoj-neon .hl{font-weight:700}
.p-nochnoj-neon .swipe{color:var(--accent)}
.p-nochnoj-neon .numlist .n{font-size:64px}
/* 4. Плакат: толстая рамка, плашка под ключевым словом, огромные номера */
.p-plakat .art{border:16px solid var(--accent);padding:134px 80px}
.p-plakat .art.s-accent,.p-plakat .art.s-ink{border-color:var(--paper)}
.p-plakat .art .foot{left:80px;right:80px;bottom:48px}
.p-plakat .art.squeeze{padding-top:94px}.p-plakat .art.squeeze2{padding-top:80px;padding-bottom:104px}
.p-plakat .hl{font-weight:700}
.p-plakat h1.hl .acc,.p-plakat h2.hl .acc{background:linear-gradient(var(--accent),var(--accent)) center/100% 74% no-repeat;color:var(--paper);padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.p-plakat .s-accent h2.hl .acc,.p-plakat .s-accent h1.hl .acc{background:linear-gradient(var(--paper),var(--paper)) center/100% 74% no-repeat;color:var(--accent)}
.p-plakat .numlist .n{font-size:128px;min-width:150px;line-height:.9}
.p-plakat .btn{border-radius:0;font-weight:600}
.p-plakat .swipe{text-transform:uppercase;font-family:var(--font-head);font-size:50px;letter-spacing:.04em}
.p-plakat .foot{text-transform:uppercase;letter-spacing:.12em;font-weight:600}
/* 5. Мягкая пастель: большие скругления, «пузыри», номера в кружках */
.p-myagkaya-pastel .art::before{content:"";position:absolute;width:760px;height:760px;border-radius:50%;right:-300px;top:-320px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.p-myagkaya-pastel .art.s-accent::before,.p-myagkaya-pastel .art.s-ink::before{background:color-mix(in srgb,var(--paper) 10%,transparent)}
.p-myagkaya-pastel .art>*:not(.foot):not(.plx):not(.badge){position:relative}
.p-myagkaya-pastel .hl{font-weight:800}
.p-myagkaya-pastel .numlist .n{font-size:46px;min-width:104px;width:104px;height:104px;border-radius:50%;background:var(--accent2);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800}
.p-myagkaya-pastel .btn{border-radius:999px;padding:30px 52px}
.p-myagkaya-pastel .swipe{background:var(--accent2);color:var(--accent);border-radius:999px;padding:14px 36px;align-self:flex-start;font-size:38px}
.p-myagkaya-pastel .s-accent .swipe{background:color-mix(in srgb,var(--paper) 20%,transparent);color:var(--paper)}
/* 6. Редакция: рубрика капсом с трекингом, двойная линейка, красная отбивка */
.p-redakciya .art:not(.s-photo)::before{content:"";position:absolute;left:96px;right:96px;top:100px;border-top:4px solid var(--ink);border-bottom:1px solid var(--ink);height:6px}
.p-redakciya .art.s-accent::before,.p-redakciya .art.s-ink::before{border-color:var(--paper)}
.p-redakciya .hl{font-weight:700}
.p-redakciya h2.hl::before{content:"";display:block;width:120px;height:8px;background:var(--accent);margin-bottom:36px}
.p-redakciya .s-accent h2.hl::before{background:var(--paper)}
.p-redakciya .foot{text-transform:uppercase;letter-spacing:.16em;font-weight:600;font-size:27px;border-top:1px solid color-mix(in srgb,currentColor 40%,transparent);padding-top:18px}
.p-redakciya .numlist .n{font-size:72px;font-weight:700}
.p-redakciya .swipe{text-transform:uppercase;letter-spacing:.14em;font-size:34px;font-weight:600}
.p-redakciya .btn{border-radius:0}
/* 7. Студийный чёрный: воздух, огромный заголовок, тонкая линия, номера в углу */
.p-studijnyj-chyornyj .hl{font-weight:800}
.p-studijnyj-chyornyj h2.hl::after{content:"";display:block;width:220px;height:2px;background:var(--ink);margin-top:44px;opacity:.7}
.p-studijnyj-chyornyj .s-accent h2.hl::after{background:var(--paper)}
.p-studijnyj-chyornyj .body{font-weight:300}
.p-studijnyj-chyornyj .s-paper .body b,.p-studijnyj-chyornyj .s-paper .acc{font-weight:500;color:var(--ink)}
.p-studijnyj-chyornyj .s-ink .body b,.p-studijnyj-chyornyj .s-ink .acc{font-weight:500;color:var(--paper)}
.p-studijnyj-chyornyj .art.s-accent{background:var(--ink);color:var(--paper)}
.p-studijnyj-chyornyj .s-accent .body b,.p-studijnyj-chyornyj .s-accent .acc,.p-studijnyj-chyornyj .s-accent .bullets p::before,.p-studijnyj-chyornyj .s-accent .inside{color:var(--paper)}
.p-studijnyj-chyornyj .s-accent .btn{background:var(--paper);color:var(--ink)}
.p-studijnyj-chyornyj .numlist .n{font-size:40px;font-weight:400;color:var(--muted);letter-spacing:.1em;min-width:120px}
.p-studijnyj-chyornyj .swipe{letter-spacing:.2em;text-transform:uppercase;font-size:30px;font-weight:500}
.p-studijnyj-chyornyj .btn{background:var(--ink);color:var(--paper);border-radius:0;letter-spacing:.02em}
.p-studijnyj-chyornyj .foot{letter-spacing:.14em;text-transform:uppercase;font-size:26px}
/* 8. Цветные блоки: свой цвет у каждого слайда, геометрический маркер в углу */
.p-cvetnye-bloki .art>*:not(.foot):not(.plx):not(.badge){position:relative}
.p-cvetnye-bloki .art.s-paper::before{content:"";position:absolute;width:300px;height:300px;right:96px;bottom:170px;background:var(--accent);opacity:.2;border-radius:var(--mark-r,50%);clip-path:var(--mark-clip,none)}
.p-cvetnye-bloki .hl{font-weight:800}
.p-cvetnye-bloki .numlist .n{font-size:44px;min-width:96px;width:96px;height:96px;border-radius:24px;background:var(--accent);color:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:800}
.p-cvetnye-bloki .btn{border-radius:20px;padding:28px 48px}
.p-cvetnye-bloki .swipe{background:var(--accent);color:var(--paper);border-radius:14px;padding:12px 30px;align-self:flex-start;font-size:36px}
.p-cvetnye-bloki .s-accent .swipe{background:var(--paper);color:var(--accent)}
/* 9. Градиентный премиум: мягкое градиентное пятно, градиентный акцент в заголовке */
.p-gradientnyj-premium .art::before{content:"";position:absolute;inset:auto -200px -260px auto;width:900px;height:700px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 26%,transparent),transparent);filter:blur(10px)}
.p-gradientnyj-premium .art::after{content:"";position:absolute;left:-260px;top:-240px;width:760px;height:620px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--grad2) 24%,transparent),transparent)}
.p-gradientnyj-premium .art.s-accent{background:linear-gradient(135deg,var(--accent),var(--grad2))}
.p-gradientnyj-premium .art.s-accent::before,.p-gradientnyj-premium .art.s-accent::after{display:none}
.p-gradientnyj-premium .art>*:not(.foot):not(.plx):not(.badge){position:relative;z-index:1}
.p-gradientnyj-premium .hl{font-weight:600}
.p-gradientnyj-premium .s-paper h1.hl .acc,.p-gradientnyj-premium .s-paper h2.hl .acc{background:linear-gradient(90deg,var(--accent),var(--grad2));-webkit-background-clip:text;background-clip:text;color:transparent}
.p-gradientnyj-premium .body{font-weight:300}.p-gradientnyj-premium .body b{font-weight:500}
.p-gradientnyj-premium .numlist .n{font-weight:300;font-size:80px}
.p-gradientnyj-premium .btn{background:linear-gradient(90deg,var(--accent),var(--grad2));border-radius:999px}
.p-gradientnyj-premium .s-accent .btn{background:var(--paper);color:var(--accent)}
/* 10. Ретро-терминал: «>» и «$» перед строками, каретка, лёгкие сканлайны */
.p-retro-terminal .art{background-image:repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in srgb,var(--ink) 4%,transparent) 3px 4px)}
.p-retro-terminal .art.s-accent{background-image:none}
.p-retro-terminal .hl{font-weight:700}
.p-retro-terminal h2.hl{position:relative;padding-left:1.25ch}
.p-retro-terminal h2.hl::before{content:">";position:absolute;left:0;top:0;color:var(--accent)}
.p-retro-terminal .s-accent h2.hl::before{color:var(--paper)}
.p-retro-terminal h1.hl::after{content:"▍";color:var(--accent);margin-left:.06em}
.p-retro-terminal .numlist .n{font-size:56px;min-width:150px;white-space:nowrap}
.p-retro-terminal .numlist .n::before{content:"$ ";opacity:.6}
.p-retro-terminal .foot,.p-retro-terminal .swipe{font-family:var(--font-head)}
.p-retro-terminal .swipe{font-size:38px}
.p-retro-terminal .btn{border-radius:6px;font-family:var(--font-head);font-size:36px;border:3px solid var(--accent);background:transparent;color:var(--accent)}
.p-retro-terminal .s-accent .btn{border-color:var(--paper);color:var(--paper)}
.p-retro-terminal .body b{color:var(--accent)}
/* тёмные шаблоны: у них --paper тёмный, поэтому текст на фото — светлым (--ink) */
.theme-dark .s-photo{color:var(--ink)}.theme-dark .s-photo-dark{color:var(--paper)}
/* тёмные шаблоны: на светлом контраст-слайде (bg:"ink") акцентный цвет текста не читается —
   выделяем тёмным текстом с подложкой-маркером в цвет акцента */
.theme-dark .s-ink .acc,.theme-dark .s-ink .body b,.theme-dark .s-ink .how b{color:var(--paper);
  background:color-mix(in srgb,var(--accent) 55%,transparent);padding:0 .12em;border-radius:.15em;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;text-shadow:none}
.theme-dark .s-ink .swipe.acc{background:none;color:var(--paper)}
/* ═══ КОНЕЦ ПРЕСЕТОВ · ХАРАКТЕР ═══ */

/* ═══ СВОИ ТИПЫ СЛАЙДОВ · CSS ═══
   Сюда ассистент добавляет стили новых типов слайдов при настройке дизайн-кода. */

/* ═══ КОНЕЦ СВОИХ ТИПОВ · CSS ═══ */

/* автоужимание: ступени плотности */
.tight .body{margin-top:36px}.tight .body+.body{margin-top:24px}
.tight .lead{margin-top:32px}
.tight .ba{gap:24px;margin-top:44px}.tight .ba-block{padding:40px 48px}

body{background:color-mix(in srgb,var(--paper) 92%,#fff);color:var(--ink)}

<script>
/* применяем пресет ДО построения страницы: токены в :root, шрифты в <head>, класс на <html> */
(function(){
  const all = JSON.parse(document.getElementById('presets').textContent);
  let key = document.body.dataset.preset || document.body.dataset.shablon || '';
  try { const d = JSON.parse(document.getElementById('slides').textContent); if (d.preset || d.shablon) key = d.preset || d.shablon; } catch(e){}
  window.PRESET_KEY = key; window.PRESET = key ? all[key] : null; window.PRESETS = all;
  if (!key) return;
  const p = all[key];
  if (!p){ console.warn('Неизвестный пресет: '+key); return; }
  const r = document.documentElement.style;
  r.setProperty('--brand', '"'+p.name+'"');
  /* data-own-colors="1" на body — шаблон в своих цветах: берём шрифты, графику и движение, цвета остаются из токенов дизайн-кода */
  const own = document.body.dataset.ownColors === '1';
  if (!own) ['paper','ink','accent','accent2','muted'].forEach(k=>r.setProperty('--'+k, p[k]));
  else if (p.cycle) delete p.cycle;
  r.setProperty('--font-head', p.font_head); r.setProperty('--font-body', p.font_body);
  r.setProperty('--head-transform', p.head_transform); r.setProperty('--head-track', p.head_track);
  r.setProperty('--head-lh', p.head_lh); r.setProperty('--radius', p.radius);
  if (p.grad2) r.setProperty('--grad2', p.grad2);
  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?'+p.gfonts+'&display=swap';
  document.head.appendChild(l);
  document.documentElement.classList.add('p-'+key, 'theme-'+p.theme);
})();
</script>

<script>
/* ═════════════════ ДВИЖОК. Ниже ничего руками не меняем. ═════════════════ */

/* ---------- типограф: ёлочки, тире, неразрывные пробелы ---------- */
const SHORT = /(^|[\s(«])(в|и|с|у|о|к|а|на|по|из|от|до|за|со|не|ни|но|же|бы|ли|под|над|при|для|про|без|как|что|это)\s/gi;
function typo(t){
  if(!t) return t;
  t = t.replace(/"([^"]+)"/g,'«$1»').replace(/\.\.\./g,'…');
  t = t.replace(/\s+-\s+/g,' — ').replace(/(\S) —/g,'$1 —');
  t = t.replace(SHORT,(m,p,w)=>p+w+' ');
  t = t.replace(/(\d) (год|года|году|лет|шаг|шага|шагов|мин|минут|раз|раза|человек|дн|дней|%|₽|\$)/g,'$1 $2');
  return t;
}
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(t){ /* **жирное** → акцент, [[текст]] → цветной акцент */
  t = typo(esc(t));
  return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[\[(.+?)\]\]/g,'<span class="acc">$1</span>').replace(/==(.+?)==/g,'<span class="mk">$1</span>');
}
function fmtCode(t){
  t = esc(t).replace(/^(#.*)$/gm,'<span class="c">$1</span>');
  return t.replace(/\[\[(.+?)\]\]/g,'<span class="hot">$1</span>');
}

/* ---------- рендер слайдов ---------- */
const BG = {paper:'s-paper', ink:'s-ink', accent:'s-accent',
            cream:'s-paper', dark:'s-ink', orange:'s-accent'}; // старые имена тоже понимаем

/* ---------- предметные элементы (виджеты): {"widget": {...}} у слайда ----------
   steps · files · checks · chat · phone · window · scheme · hub · picker · url · doc · progress · shot
   Позиция: "pos":"top" — над текстом, иначе под текстом. Все части помечены .ai — их подхватывает анимация. */
function widgetHTML(w){
  if (!w || !w.type) return '';
  const top = w.pos === 'top' ? ' top' : '';
  const T = t => typo(esc(t||'')), F = t => fmt(t||'');
  let h = '';
  if (w.type === 'steps'){
    const n = w.items.length;
    h = `<div class="wg wg-steps${top}" style="--h:${w.height||280}px">` + w.items.map((it,i)=>`<div class="st ai gy${(w.on ?? n) === i+1 ? ' on' : ''}" style="height:${Math.round(46 + 54*(i+1)/n)}%"><b>${i+1}</b>${T(it)}</div>`).join('') + `</div>`;
  } else if (w.type === 'files'){
    h = `<div class="wg wg-files${top}">` + w.items.map(it=>`<div class="fr wcard ai"><i></i><span>${F(it)}</span></div>`).join('') + `</div>`;
  } else if (w.type === 'checks'){
    h = `<div class="wg wg-checks${top}">` + w.items.map(it=>`<div class="cr ai"><span class="ic"><svg viewBox="0 0 50 50"><path d="M14 26 L22 34 L37 17" fill="none" stroke="var(--acfg)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>${F(it)}</span></div>`).join('') + `</div>`;
  } else if (w.type === 'chat'){
    h = `<div class="wg wg-chat${top}">` + (w.messages||[]).map(m=>`<div class="m ai ${m.who==='ai'?'bot':'me'}">${F(m.text)}</div>`).join('') + `</div>`;
  } else if (w.type === 'phone'){
    const msgs = (w.messages||[]).map(m=>`<div class="msg ai${m.me?' me':''}">${F(m.text)}${m.meta?`<div class="mt">${T(m.meta)}</div>`:''}</div>`).join('');
    h = `<div class="wg wg-phone${top}" style="--h:${w.height||520}px"><div class="ph ai"><div class="scr"><div class="isl"></div><div class="hd"><i></i><div><div class="nm">${T(w.name||'')}</div><div class="sb">${T(w.sub||'')}</div></div></div>${msgs}</div></div></div>`;
  } else if (w.type === 'window'){
    const kind = w.kind || 'app';
    const tb = `<div class="tb"><i></i><i></i><i></i>${kind==='browser'?`<span class="u">${T(w.url||'')}</span>`:''}</div>`;
    let bd = '';
    if (kind === 'terminal') bd = (w.lines||[]).map((l,i,a)=>`<div class="ln ai"><span class="pr">${T(w.prompt||'$')}</span><span>${T(l)}${i===a.length-1?'<span class="cur"></span>':''}</span></div>`).join('');
    else { if (w.label) bd += `<p class="lb">${T(w.label)}</p>`; if (w.box) bd += `<div class="box ai">${F(w.box)}</div>`; if (w.label2) bd += `<p class="lb">${T(w.label2)}</p>`;
      bd += (w.lines||[]).map(l=>`<div class="ln ai"><span>${F(l)}</span></div>`).join(''); if (w.text) bd += `<div class="ai">${F(w.text)}</div>`; }
    h = `<div class="wg wg-win wcard${kind==='terminal'?' term':''}${top}">${tb}<div class="bd">${bd}</div></div>`;
  } else if (w.type === 'scheme'){
    const col = w.dir === 'column';
    h = `<div class="wg wg-scheme${col?' col':''}${top}">` + w.items.map((it,i)=>(i?`<div class="ar ai"><svg viewBox="0 0 30 30"><path d="M9 4 L21 15 L9 26" fill="none" stroke="var(--ac)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`:'')+`<div class="bk wcard ai${(w.on===i+1)?' on':''}">${F(it)}</div>`).join('') + `</div>`;
  } else if (w.type === 'hub'){
    const items = (w.items||[]).slice(0,6), n = items.length;
    const pos = n <= 2 ? [[10,50],[90,50]] : n <= 4 ? [[10,16],[90,16],[10,84],[90,84]] : [[10,14],[90,14],[10,50],[90,50],[10,86],[90,86]];
    const lines = items.map((_,i)=>`<line class="ai fd" x1="50%" y1="50%" x2="${pos[i][0]}%" y2="${pos[i][1]}%" stroke="var(--ac)" stroke-width="4" stroke-linecap="round"/>`).join('');
    const sv = items.map((x,i)=>`<div class="sv wcard ai sc" style="${pos[i][0] < 50 ? 'left:0' : 'right:0'};top:${pos[i][1]}%">${T(x)}</div>`).join('');
    h = `<div class="wg wg-hub${top}" style="--h:${w.height||400}px"><svg>${lines}</svg>${sv}<div class="c ai sc">${T(w.center||'')}</div></div>`;
  } else if (w.type === 'picker'){
    const its = (w.items||[]).map(m=>`<div class="it ai${m.on?' on':''}"><div>${T(m.name)}${m.sub?`<small>${T(m.sub)}</small>`:''}</div>${m.on?'<span>✓</span>':''}</div>`).join('');
    h = `<div class="wg wg-pick${top}"><div class="menu wcard ai">${its}</div><div class="bar wcard ai"><span>${T(w.placeholder||'Напиши задачу…')}</span><b>${T(w.current||'')} ⌄</b></div></div>`;
  } else if (w.type === 'url'){
    h = `<div class="wg wg-url wcard ai${top}"><svg viewBox="0 0 34 44"><rect x="3" y="19" width="28" height="22" rx="6" fill="none" stroke="var(--ac)" stroke-width="5"/><path d="M9 19 V13 a8 8 0 0 1 16 0 V19" fill="none" stroke="var(--ac)" stroke-width="5"/></svg><span>${T(w.text)}</span></div>`;
  } else if (w.type === 'doc'){
    h = `<div class="wg wg-doc wcard ai${top}"><i></i><div><div class="t">${F(w.title)}</div>${w.sub?`<div class="s">${T(w.sub)}</div>`:''}</div></div>`;
  } else if (w.type === 'progress'){
    h = (w.items||[]).map(it=>`<div class="wg wg-prog${top}"><div class="lbl ai"><span>${F(it.label)}</span><span>${T(it.caption||'')}</span></div><div class="tr ai fd"><div class="fl ai gx" style="width:${Math.max(0,Math.min(100,it.value))}%"></div></div></div>`).join('');
  } else if (w.type === 'shot'){
    h = `<div class="wg wg-shot wcard ai${w.frame==='phone'?' phone-frame':''}${top}"><img src="${w.image}"></div>`;
  } else h = `<p class="body">Неизвестный виджет: ${esc(w.type)}</p>`;
  return h;
}
function extrasHTML(s){
  let h = '';
  if (s.note_card) h += `<div class="ntc ai">${fmt(s.note_card)}</div>`;
  if (s.badge) h += `<div class="badge ai sc">${typo(esc(s.badge))}</div>`;
  return h;
}

function slideHTML(s, idx, total){
  const typ = s.type;
  let inner0 = '';   /* слой параллакс-фона, если фото анимируется */
  let cls = BG[s.bg] || 's-paper';
  let style = '';
  if (s.photo){
    const darkText = s.photo_text === 'dark';
    cls = 's-photo' + (darkText ? ' s-photo-dark' : '') + (s.scrim === false ? '' : ' scrim');
    style = `background-image:url('${s.photo}')`;
    if (s.anim === 'parallax'){ inner0 = `<div class="plx" style="${style}"></div>`; style = ''; }
  }
  const brandFoot = document.body.dataset.foot || '';
  const foot = (typ==='cover'||typ==='cta'||s.nofoot) ? '' :
    `<div class="foot"><span>${esc(brandFoot)}</span><span>${String(idx)}</span></div>`;
  const h = s.h_size ? ` ${s.h_size}` : '';
  let inner = '';
  if (typ==='cover'){
    const hs = s.h_size ? ` ${s.h_size}` : (s.photo ? ' h0-photo' : ' h0');
    inner = `<h1 class="hl${hs}">${fmt(s.title)}</h1>`;
    const leadStyle = s.lead_align==='right'
      ? 'margin-left:auto;text-align:right;max-width:14ch'
      : `max-width:${s.photo?'26ch':'17ch'}`;
    if (s.lead) inner += `<p class="lead" style="${leadStyle}">${fmt(s.lead)}</p>`;
    const swStyle = (s.swipe_up?'margin-top:40px;':'') + (s.lead_align==='right'?'margin-left:auto;':'');
    inner += `<div class="swipe acc" style="${swStyle}">${esc(s.swipe||'Листай →')}</div>`;
  } else if (typ==='content'){
    if (s.dense) cls += ' dense';
    inner = `<h2 class="hl h1${h}">${fmt(s.title)}</h2>`;
    if (s.quote) inner += `<div class="quotebox">«${fmt(s.quote)}»</div>`;
    (s.paragraphs||[]).forEach(p=> inner += `<p class="body">${fmt(p)}</p>`);
  } else if (typ==='patterns'){
    inner = `<h2 class="hl h1${h||' h1-sm'}">${fmt(s.title)}</h2>`;
    (s.items||[]).forEach(it=>{
      inner += `<div class="pat"><p class="bad">«${fmt(it.bad)}»</p>`;
      if (it.why) inner += `<p class="why">${typo(esc(it.why))}</p>`;
      inner += `<p class="good">${fmt(it.good)}${it.note?` <i>${typo(esc(it.note))}</i>`:''}</p></div>`;
    });
  } else if (typ==='step'){
    const n=s.step, tot=s.of||5;
    let dots=''; for(let i=0;i<tot;i++) dots+=`<i class="${i<n?'on':''}"></i>`;
    inner = `<div class="step-eyebrow">${typo(esc(s.label||('Шаг '+n)))}</div><div class="dots">${dots}</div>`;
    inner += `<h2 class="hl h1${h}">${fmt(s.title)}</h2>`;
    (s.paragraphs||[]).forEach(p=> inner += `<p class="body">${fmt(p)}</p>`);
  } else if (typ==='bignum'){
    inner = `<h2 class="hl h1${h}">${fmt(s.title)}</h2><div class="bignum">${esc(s.value)}</div>`;
    inner += `<p class="bignum-cap">${fmt(s.caption||'')}</p>`;
    if (s.source) inner += `<p class="bignum-src">${typo(esc(s.source))}</p>`;
  } else if (typ==='before_after'){
    inner = `<h2 class="hl h1${h}">${fmt(s.title)}</h2><div class="ba">`+
      `<div class="ba-block ba-was"><p class="ba-label">${esc(s.before_label||'Раньше')}</p><p class="ba-text">${fmt(s.before)}</p></div>`+

/* ---------- автоужимание: лестница, пока всё не влезет ----------
   1) заголовок ниже ступенью  2) отступы плотнее  3) тело меньше (до пола)
   4) экстренно: занимаем верхнее/нижнее поле  5) честно предупреждаем */
const H_LADDER = {h0:['h0','h0-sm','h0-xs','h0-xxs','h0-xxxs'],
  photo:['h0-photo','h0-xs','h0-xxs','h0-xxxs'], h1:['h1','h1-sm','h1-xs','h1-xxs']};
function overflowPx(art){
  /* offset-геометрия: не зависит от transform:scale превью */
  const foot = art.querySelector('.foot');
  const limit = (foot && foot.offsetParent) ? (foot.offsetTop - 48)
                     : (art.offsetHeight - parseFloat(getComputedStyle(art).paddingBottom));
  let max = 0;
  art.querySelectorAll(':scope > *:not(.foot):not(.badge)').forEach(el=>{
    const b = el.offsetTop + el.offsetHeight;
    if (b > max) max = b;
  });
  return Math.round(max - limit);
}
function stepDownHead(art){
  const head = art.querySelector('.h0,.h0-photo,.h0-sm,.h0-xs,.h0-xxs,.h1,.h1-sm,.h1-xs,.h1-xxs');
  if (!head) return false;
  if (head.style.fontSize){
    /* заголовок уже на точном кегле (подгонка по ширине) — жмём его пропорционально */
    const cur = parseFloat(head.style.fontSize);
    if (cur <= 66) return false;
    head.style.fontSize = Math.max(64, Math.floor(cur * 0.82)) + 'px';
    return true;
  }
  for (const ladder of Object.values(H_LADDER)){
    for (let i=0;i<ladder.length-1;i++){
      if (head.classList.contains(ladder[i])){
        head.classList.replace(ladder[i], ladder[i+1]);
        return true;
      }
    }
  }
  return false;
}
function fitWide(art){
  /* большая цифра: одной строкой, кегль по ширине (мин. 120px) */
  art.querySelectorAll('.bignum').forEach(el=>{
    if (el.scrollWidth > el.clientWidth){
      const fs = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = Math.max(120, Math.floor(fs * el.clientWidth / el.scrollWidth) - 4) + 'px';
    }
  });
}
const CONTENT_W = 1080 - 192;  /* ширина контента слайда: холст минус поля */
function widestChunk(el){
  /* самое широкое неразрывное слово заголовка (nbsp-связки — один кусок) */
  const cs = getComputedStyle(el);
  const ctx = widestChunk._c || (widestChunk._c = document.createElement('canvas').getContext('2d'));
  ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const ls = parseFloat(cs.letterSpacing) || 0;
  const txt = cs.textTransform === 'uppercase' ? el.textContent.toUpperCase() : el.textContent;
  let max = 0;
  txt.split(/[ \t\n]+/).forEach(w => {
    if (w) max = Math.max(max, ctx.measureText(w).width + ls * w.length);
  });
  return max;
}
function autofit(art){
  fitWide(art);
  /* ширина заголовка: неразрывный кусок не должен упираться в край — точная подгонка кегля */
  const headW = art.querySelector('.h0,.h0-photo,.h0-sm,.h0-xs,.h0-xxs,.h1,.h1-sm,.h1-xs,.h1-xxs');
  if (headW){
    const wc = widestChunk(headW);
    if (wc > CONTENT_W){
      const fs = parseFloat(getComputedStyle(headW).fontSize);
      headW.style.fontSize = Math.max(64, Math.floor(fs * CONTENT_W / wc) - 2) + 'px';
    }
  }
  const steps = [
    ()=>stepDownHead(art),
    ()=>{ if (art.classList.contains('tight')) return false; art.classList.add('tight'); return true; },
    ()=>stepDownHead(art),
    ()=>{ if (art.classList.contains('body-sm')) return false; art.classList.add('body-sm'); return true; },
    ()=>stepDownHead(art),
    ()=>{ if (art.classList.contains('body-xs')) return false; art.classList.add('body-xs'); return true; },
    ()=>{ if (art.classList.contains('squeeze')) return false; art.classList.add('squeeze'); return true; },
    ()=>{ if (art.classList.contains('squeeze2')) return false; art.classList.add('squeeze2'); return true; },
  ];
  /* порог 2px: субпиксельные разницы браузера/ретины — не переполнение;
     шаг, который не уменьшил перелив, откатываем и выходим — иначе на слайдах,
     где лестница бессильна (обложка со свайпом у нижнего поля), она крутится
     вхолостую, мельчит заголовок и вешает ложный бейдж */
  const TOL = 2;   /* допуск на субпиксельное округление разных браузеров/ретины */
  const headSel = '.h0,.h0-photo,.h0-sm,.h0-xs,.h0-xxs,.h1,.h1-sm,.h1-xs,.h1-xxs';
  const headEl = art.querySelector(headSel);
  const snap = () => ({ a: art.className,
                        h: headEl && headEl.className,
                        f: headEl && headEl.style.fontSize });
  const restore = s => { art.className = s.a;
    if (headEl){ headEl.className = s.h; headEl.style.fontSize = s.f; } };
  let guard = 24;
  while (overflowPx(art) > TOL && guard-- > 0){
    const before = overflowPx(art);
    let progressed = false;
    for (const st of steps){
      const point = snap();
      if (!st()) continue;                    /* ступень уже пройдена */
      if (overflowPx(art) < before){ progressed = true; break; }
      restore(point);                         /* не помогла — откат, пробуем следующую */
    }
    if (!progressed) break;                   /* лестница бессильна — не мельчим вхолостую */
  }
  const left = overflowPx(art);
  return left > TOL ? left : 0;
}

/* ---------- контраст: worst-case проверка цветовых пар ---------- */
function lum(hex){
  const m = hex.trim().match(/^#?([0-9a-f]{6})$/i); if(!m) return null;
  const v = [0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)/255)
    .map(c=>c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4));
  return .2126*v[0]+.7152*v[1]+.0722*v[2];
}
function ratio(a,b){
  const la=lum(a), lb=lum(b); if(la==null||lb==null) return null;
  const [hi,lo]=la>lb?[la,lb]:[lb,la]; return (hi+.05)/(lo+.05);
}

const frames = [];

    <ul class="rules">

      <li><b>2. Отступы −25%</b> — межблочные зазоры жмутся, поля 96 не трогаем</li>
      <li><b>3. Тело на ступень ниже</b> — до пола читаемости, мельче движок не пойдёт</li>
      <li><b>4. Экстренно</b> — занимаем верхнее и нижнее поле</li>
      <li><b>Дальше — честные бейджи</b>: «Не влезает» — сократи или разнеси на два слайда;
        «Очень плотно» — влезло на пределе, лучше сократить. Решение всегда за тобой</li>
    </ul>
    <!-- ДИЗАЙН-КОД · СТИЛЬ ИЗОБРАЖЕНИЙ: скилл заполняет эту секцию при настройке фонов -->
    <h3 style="margin-top:24px">Стиль изображений</h3>
    <p>Пока не настроен. Задаётся один раз при подключении фирменных фонов —
      тогда здесь появится манера, палитра генераций, сюжеты и запреты.</p>
    <!-- КОНЕЦ СТИЛЯ ИЗОБРАЖЕНИЙ -->
  </div>
  </div>`;
  page.appendChild(sys);
}

/* автоужимание + проверки — после загрузки шрифтов */
const report = {overflow:[], contrast:[], tight:[]};
async function runChecks(){
  try { await document.fonts.ready; } catch(e){}
  await new Promise(r=>setTimeout(r,150));
  const css = getComputedStyle(document.documentElement);
  const paper = css.getPropertyValue('--paper').trim(),
        ink = css.getPropertyValue('--ink').trim(),
        accent = css.getPropertyValue('--accent').trim(),
        accent2 = css.getPropertyValue('--accent2').trim();
  const pairChecks = [
    ['текст на светлом фоне', paper, ink],
    ['светлый текст на тёмном', ink, paper],
    ['светлый текст на акцентном фоне', accent, paper],
    ['акцент на светлом фоне', paper, accent],
  ];
  pairChecks.forEach(([name,bg,fg])=>{
    const r = ratio(bg,fg);
    if (r !== null && r < 2.9) report.contrast.push(`${name}: контраст ${r.toFixed(1)}:1 (норма для крупного текста — от 3:1). Текст может тонуть — проверь на телефоне или подкрути цвет`);
  });
  frames.forEach((frame,i)=>{
    const art = frame.querySelector('.art');
    const left = autofit(art);
    if (left > 2){
      report.overflow.push(i+1);
      const b = document.createElement('div');
      b.className = 'over-badge';
      b.textContent = `Не влезает ~${left}px — сократи текст слайда ${i+1}`;
      frame.appendChild(b);
    } else if (art.classList.contains('body-xs') || art.classList.contains('squeeze')){
      report.tight.push(i+1);
      const b = document.createElement('div');
      b.className = 'tight-badge';
      b.textContent = 'Очень плотно — лучше сократить';
      frame.appendChild(b);
    }
  });
  const st = document.getElementById('status');
  const parts = [`${slides.length} слайдов`];
  if (report.overflow.length) parts.push(`⚠ не влезает текст: слайд ${report.overflow.join(', ')}`);
  if (report.tight.length) parts.push(`⚠ очень плотно (текст ужат до предела): слайд ${report.tight.join(', ')} — лучше сократить`);
  if (report.contrast.length) parts.push(`⚠ ${report.contrast[0]}`);
  if (!report.overflow.length && !report.contrast.length && !report.tight.length) parts.push('все проверки пройдены ✓');
  st.textContent = parts.join(' · ');
  st.className = 'status' + ((report.overflow.length||report.contrast.length||report.tight.length) ? ' warn' : '');
}
runChecks();

/* ---------- экспорт PNG ---------- */
const CDN = {
  snapdom: 'https://cdn.jsdelivr.net/npm/@zumer/snapdom@2.15.0/dist/snapdom.min.js',
  snapdom2: 'https://unpkg.com/@zumer/snapdom@2.15.0/dist/snapdom.js',
  hti: 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js',
  jszip: 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
  jszip2: 'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js',
};
function loadScript(src){
  return new Promise((ok,err)=>{
    const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=err;
    document.head.appendChild(s);
  });
}
let libReady = null;
async function ensureLibs(){
  if (libReady) return libReady;
  libReady = (async ()=>{
    try { await loadScript(CDN.snapdom); } catch(e){}
    if (!window.snapdom){ try { await loadScript(CDN.snapdom2); } catch(e){} }
    if (!window.snapdom){ try { await loadScript(CDN.hti); } catch(e){} }
    try { await loadScript(CDN.jszip); } catch(e){}
    if (!window.JSZip){ try { await loadScript(CDN.jszip2); } catch(e){} }
    if (!window.snapdom && !window.htmlToImage)
      throw new Error('Не загрузилась библиотека экспорта. Проверь интернет и обнови страницу (Ctrl+R / Cmd+R).');
  })();
  return libReady;
}
let fontsWarm = null;
async function warmFonts(){
  if (fontsWarm) return fontsWarm;
  fontsWarm = (async()=>{ try { await document.fonts.ready; } catch(e){}
    try { await Promise.all([...document.fonts].map(f=>f.status==='loaded'?f:f.load().catch(()=>null))); } catch(e){}
    if (window.snapdom && snapdom.preCache){ try { await snapdom.preCache(document.body, {embedFonts:true}); } catch(e){} }
    /* первый снимок snapdom встраивает шрифты с гонкой: латиница наборного шрифта
       уходит в системный фолбэк (Claude/ChatGPT на обложке). Холостой прогон
       прогревает кэш — дальше все слайды снимаются с правильными шрифтами. */
    const firstArt = document.querySelector('.art');
    if (window.snapdom && firstArt){ try { await snapdom.toBlob(firstArt, {type:'png', scale:1, dpr:1, embedFonts:true}); } catch(e){} } })();
  return fontsWarm;
}
async function slideToBlob(art){
  await warmFonts();
  if (window.snapdom){
    return await snapdom.toBlob(art, {type:'png', scale:1, dpr:1, embedFonts:true});
  }
  return await htmlToImage.toBlob(art, {pixelRatio:1, canvasWidth:1080, canvasHeight:1350});
}
function saveBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 4000);
}
const slugBase = (data.slug || brand || 'carousel').toString()
  .toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-').replace(/^-+|-+$/g,'') || 'carousel';

page.addEventListener('click', async e=>{
  const btn = e.target.closest('.dl'); if (!btn) return;
  btn.disabled = true; btn.textContent = '…';
  try {
    await ensureLibs();
    const i = +btn.dataset.i;
    const blob = await slideToBlob(frames[i].querySelector('.art'));
    saveBlob(blob, `${slugBase}-${String(i+1).padStart(2,'0')}.png`);
    btn.textContent = '✓ PNG';
  } catch(err){ alert(err.message || err); btn.textContent = 'PNG'; }
  btn.disabled = false;
});

document.getElementById('dl-all').addEventListener('click', async e=>{
  const btn = e.target; btn.disabled = true;
  const st = document.getElementById('status');
  try {
    await ensureLibs();
    const zip = window.JSZip ? new JSZip() : null;
    for (let i=0;i<frames.length;i++){
      st.textContent = `Экспорт: слайд ${i+1} из ${frames.length}…`;
      const art = frames[i].querySelector('.art'), isVid = !!(art.dataset.anim && window.slideToVideo);
      const blob = isVid ? await slideToVideo(art, (n,t)=>{ st.textContent = `Видео: слайд ${i+1} — ${Math.round(n/t*100)}%`; })
                         : await slideToBlob(art);
      const name = `${slugBase}-${String(i+1).padStart(2,'0')}.${isVid ? 'mp4' : 'png'}`;
      if (zip) zip.file(name, blob); else saveBlob(blob, name);
    }
    if (zip){
      st.textContent = 'Собираю zip…';
      const blob = await zip.generateAsync({type:'blob'});
      saveBlob(blob, `${slugBase}.zip`);
    }
    st.textContent = `Готово: ${frames.length} слайдов скачано ✓`;
  } catch(err){ alert(err.message || err); st.textContent = 'Экспорт не удался'; }
  btn.disabled = false;
});

/* ---------- анимация слайдов → MP4 ----------
   Слайд с "anim" в JSON двигается ТВОИМИ цветами и шрифтами: движок только проявляет то,
   что уже свёрстано по дизайн-коду, своих цветов и декора не добавляет.
   Виды: "words" — слова заголовка по очереди, остальное всплывает (по умолчанию для true);
         "fade" — блоки спокойно проявляются снизу; "parallax" — у фото-обложки текст стоит,
         фон медленно плывёт (петля без скачка — превью в сетке всегда читается).
   Видео: анимация один раз + 15 с стоп-кадра (в карусели Instagram видео крутится по кругу —
   так текст успевают дочитать). 1080×1350, 30 к/с, H.264 — кодирует сам браузер (Chrome/Edge). */
const ANIM = { fps: 30, hold: 15, loop: 12 };
const springAt = (t, c) => { if (t <= 0) return 0; let x = 0, v = 0; const dt = 1/120;
  for (let q = 0; q < t; q += dt){ const a = (-c.k*(x-1) - c.d*v)/c.m; v += a*dt; x += v*dt; } return x; };
const clamp01 = x => Math.max(0, Math.min(1, x));
const SPR = {d:16, k:140, m:.7}, SPR2 = {d:11, k:160, m:.8};
function splitWords(el){
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), ns = [];
  while (w.nextNode()) ns.push(w.currentNode);
  ns.forEach(n=>{ const f = document.createDocumentFragment();
    n.textContent.split(/(\s+)/).forEach(p=>{ if (!p) return;
      if (/^\s+$/.test(p)) f.appendChild(document.createTextNode(p));
      else { const s = document.createElement('span'); s.className = 'aw'; s.style.display = 'inline-block'; s.textContent = p; f.appendChild(s); } });
    n.parentNode.replaceChild(f, n); });
}
const plans = new WeakMap();
const MOTION = (window.PRESET && window.PRESET.motion) || 'soft';
/* характер движения пресета: как проявляются заголовок и блоки
   soft — мягкая пружина (по умолчанию) · snap — быстро и без отскока · stamp — штампом с масштабом
   flash — слова со вспышкой яркости · slow — медленное проявление целиком · lines — строки заголовка по одной
   bounce — упругий выскок блоков · drift — плавное проявление, фон-градиент дрейфует · type — печать по буквам */
const MSPR = { soft:{d:16,k:140,m:.7}, snap:{d:30,k:260,m:.6}, stamp:{d:14,k:220,m:.9}, flash:{d:16,k:160,m:.7},
  slow:{d:26,k:60,m:1}, lines:{d:22,k:180,m:.7}, bounce:{d:9,k:150,m:.7}, drift:{d:24,k:70,m:1}, type:{d:30,k:300,m:.5} };
function splitChars(el){
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), ns = [];
  while (w.nextNode()) ns.push(w.currentNode);
  ns.forEach(n=>{ const f = document.createDocumentFragment();
    [...n.textContent].forEach(ch=>{ if (/\s/.test(ch)) f.appendChild(document.createTextNode(ch));
      else { const s = document.createElement('span'); s.className = 'ac'; s.textContent = ch; f.appendChild(s); } });
    n.parentNode.replaceChild(f, n); });
}
function splitLines(el){
  /* делим заголовок на визуальные строки: слова → группируем по offsetTop */
  splitWords(el); const ws = [...el.querySelectorAll('.aw')]; const lines = []; let cur = null, top = null;
  ws.forEach(w=>{ const t = w.offsetTop; if (top === null || Math.abs(t - top) > 4){ cur = []; lines.push(cur); top = t; } cur.push(w); });
  return lines;
}
function animPlan(art){
  if (plans.has(art)) return plans.get(art);
  let kind = art.dataset.anim; const items = [];
  if (kind === 'true' || kind === 'words') kind = 'preset';
  if (kind === 'parallax'){
    const pl = { items:[{el:art.querySelector('.plx'), at:0, k:'plx'}], end:ANIM.loop, loop:true };
    plans.set(art, pl); return pl;
  }
  let t = .15;
  const heads = [...art.querySelectorAll('.hl')];
  const M = kind === 'preset' ? MOTION : (kind === 'fade' ? 'slow' : 'soft');
  const spr = MSPR[M] || MSPR.soft;
  if (M === 'type'){ heads.forEach(splitChars);
    art.querySelectorAll('.hl .ac').forEach(c=>{ items.push({el:c, at:t, k:'show', spr}); t += .035; }); t += .2; }
  else if (M === 'lines'){ heads.forEach(h=>splitLines(h).forEach(line=>{ line.forEach(w=>items.push({el:w, at:t, k:'slide', d:120, spr})); t += .22; })); t += .1; }
  else if (M === 'stamp'){ heads.forEach(splitWords);
    art.querySelectorAll('.hl .aw').forEach(w=>{ items.push({el:w, at:t, k:'stamp', spr}); t += .09; }); t += .15; }
  else if (M === 'slow' || M === 'drift'){ heads.forEach(h=>{ items.push({el:h, at:t, k:'pop', d:30, spr}); t += .35; }); }
  else if (M === 'snap'){ heads.forEach(splitWords);
    art.querySelectorAll('.hl .aw').forEach(w=>{ items.push({el:w, at:t, k:'snap', d:40, spr}); t += .05; }); t += .12; }
  else { heads.forEach(splitWords);
    art.querySelectorAll('.hl .aw').forEach(w=>{ items.push({el:w, at:t, k: M==='flash' ? 'flash' : 'pop', d:80, spr}); t += .07; }); t += .15; }
  const gap = {slow:.3, drift:.3, snap:.12, type:.16}[M] || .18;
  [...art.children].forEach(el=>{
    if (el.classList.contains('hl') || el.classList.contains('foot')) return;
    const big = /bignum|stat|num/.test(el.className);
    const base = big ? 'scale' : (M==='bounce' ? 'bounce' : (M==='snap' ? 'snap' : 'pop'));
    if (el.classList.contains('wg') || el.classList.contains('badge') || el.classList.contains('ntc')){
      /* виджет: контейнер не двигаем (кроме телефона), части .ai появляются по очереди */
      const parts = [...el.querySelectorAll('.ai')]; if (el.classList.contains('ai')) parts.unshift(el);
      parts.forEach(pt=>{ const k = pt.classList.contains('gy') ? 'growY' : pt.classList.contains('gx') ? 'growX' : pt.classList.contains('fd') ? 'fade' : pt.classList.contains('sc') ? 'scale' : base;
        items.push({el:pt, at:t, k, d: pt.classList.contains('ph') ? 260 : 40, spr}); t += .13; });
      t += .1; return; }
    items.push({el, at:t, k: base, d: M==='slow'||M==='drift' ? 28 : 45, spr}); t += gap;
  });
  const pl = { items, end: t + .6, loop:false };
  plans.set(art, pl); return pl;
}
function animSet(art, t){
  animPlan(art).items.forEach(it=>{ const el = it.el; if (!el) return; const lt = t - it.at;
    if (it.k === 'plx'){ const q = (1 - Math.cos(2*Math.PI*(t % ANIM.loop)/ANIM.loop + Math.PI/2))/2;
      el.style.transform = `translateY(${-3.5*q}%) scale(${1 + .05*q})`; return; }
    const SP = it.spr || SPR;
    if (it.k === 'scale'){ const s = springAt(lt, SPR2); el.style.opacity = clamp01(lt/.2);
      el.style.transform = `scale(${.6 + .4*s})`; el.style.transformOrigin = 'left center'; return; }
    if (it.k === 'show'){ el.style.opacity = lt > 0 ? 1 : 0; el.style.transform = ''; return; }
    if (it.k === 'growY'){ const s = springAt(lt, SP); el.style.transformOrigin = 'center bottom'; el.style.transform = `scaleY(${Math.max(0,s)})`; el.style.opacity = lt > 0 ? 1 : 0; return; }
    if (it.k === 'growX'){ const s = springAt(lt, SP); el.style.transformOrigin = 'left center'; el.style.transform = `scaleX(${Math.max(0,s)})`; el.style.opacity = lt > 0 ? 1 : 0; return; }
    if (it.k === 'fade'){ el.style.opacity = clamp01(lt/.35); return; }
    if (it.k === 'stamp'){ const s = springAt(lt, SP); el.style.opacity = clamp01(lt/.08);
      el.style.transform = `scale(${1.6 - .6*s})`; el.style.transformOrigin = 'center'; return; }
    if (it.k === 'snap'){ const s = clamp01(lt/.18); el.style.opacity = s; el.style.transform = `translateY(${(1-s)*(it.d||40)}px)`; return; }
    if (it.k === 'slide'){ const s = springAt(lt, SP); el.style.opacity = clamp01(lt/.2); el.style.transform = `translateX(${(1-s)*(it.d||120)}px)`; return; }
    if (it.k === 'bounce'){ const s = springAt(lt, SP); el.style.opacity = clamp01(lt/.15); el.style.transform = `translateY(${(1-s)*70}px) scale(${.9+.1*Math.min(1,s)})`; el.style.transformOrigin = 'left top'; return; }
    if (it.k === 'flash'){ const s = springAt(lt, SP); el.style.opacity = clamp01(lt/.2);
      el.style.transform = `translateY(${(1-s)*it.d}px)`; el.style.filter = lt > 0 && lt < .35 ? `brightness(${1 + (0.35-lt)*4})` : ''; return; }
    const s = springAt(lt, SP); el.style.opacity = clamp01(lt/.3); el.style.transform = `translateY(${(1-s)*it.d}px)`;
  });
}
function animReset(art){ animSet(art, 999); if (art.dataset.anim === 'parallax') animSet(art, 0); }
/* «Технологичный минимализм» — отключаем пружинный отскок у snap через сплошную функцию выше */
frames.forEach(f=>{ const a = f.querySelector('.art'); if (a && a.dataset.anim) animReset(a); });

/* живой предпросмотр на странице */
page.addEventListener('click', e=>{
  const b = e.target.closest('.play'); if (!b) return;
  const art = frames[+b.dataset.i].querySelector('.art'); const pl = animPlan(art);
  const t0 = performance.now(), dur = pl.loop ? pl.end : pl.end + .8;
  const tick = now => { const t = (now - t0)/1000; animSet(art, Math.min(t, dur));
    if (t < dur) requestAnimationFrame(tick); else animReset(art); };
  requestAnimationFrame(tick);
});

const MUXER = ['https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.min.js',
               'https://unpkg.com/mp4-muxer@5.2.1/build/mp4-muxer.min.js'];
async function ensureVideoLibs(){
  await ensureLibs();
  if (!window.snapdom){ try { await loadScript(CDN.snapdom2); } catch(e){} }
  if (!window.Mp4Muxer){ for (const u of MUXER){ try { await loadScript(u); } catch(e){} if (window.Mp4Muxer) break; } }
  if (!('VideoEncoder' in window)) throw new Error('Этот браузер не умеет собирать видео. Открой файл в Chrome или Edge на компьютере.');
  if (!window.Mp4Muxer || !window.snapdom) throw new Error('Не загрузились библиотеки для видео. Проверь интернет и обнови страницу.');
}
window.slideToVideo = slideToVideo;
async function slideToVideo(art, onStep){
  await ensureVideoLibs(); await warmFonts();
  const W = 1080, H = 1350, fps = ANIM.fps, pl = animPlan(art);
  const moveFrames = Math.round((pl.loop ? pl.end : pl.end + .2) * fps);
  const holdFrames = pl.loop ? 0 : ANIM.hold * fps, total = moveFrames + holdFrames;
  const target = new Mp4Muxer.ArrayBufferTarget();
  const muxer = new Mp4Muxer.Muxer({ target, video:{codec:'avc', width:W, height:H}, fastStart:'in-memory' });
  let fail = null;
  const enc = new VideoEncoder({ output:(ch, meta)=>muxer.addVideoChunk(ch, meta), error:e=>{ fail = e; } });
  enc.configure({ codec:'avc1.640028', width:W, height:H, bitrate:12_000_000, framerate:fps });
  const cvs = document.createElement('canvas'); cvs.width = W; cvs.height = H; const ctx = cvs.getContext('2d');
  const put = (src, n) => { const f = new VideoFrame(src, {timestamp: Math.round(n*1e6/fps), duration: Math.round(1e6/fps)});
    enc.encode(f, {keyFrame: n % fps === 0}); f.close(); };
  for (let n = 0; n < moveFrames; n++){
    animSet(art, n/fps);
    const shot = await snapdom.toCanvas(art, {scale:1, dpr:1, embedFonts:true});
    ctx.clearRect(0,0,W,H); ctx.drawImage(shot, 0, 0, W, H); put(cvs, n);
    if (enc.encodeQueueSize > 8) await new Promise(r=>setTimeout(r, 20));
    if (fail) throw fail; onStep && onStep(n+1, total);
  }
  for (let n = moveFrames; n < total; n++){ put(cvs, n); if (n % 60 === 0){ await new Promise(r=>setTimeout(r)); onStep && onStep(n+1, total); } }
  await enc.flush(); muxer.finalize(); animReset(art);
  if (fail) throw fail;
  return new Blob([target.buffer], {type:'video/mp4'});
}
page.addEventListener('click', async e=>{
  const b = e.target.closest('.dlv'); if (!b) return;
  const i = +b.dataset.i; b.disabled = true;
  try { const blob = await slideToVideo(frames[i].querySelector('.art'), (n,t)=>{ b.textContent = Math.round(n/t*100)+'%'; });
    saveBlob(blob, `${slugBase}-${String(i+1).padStart(2,'0')}.mp4`); b.textContent = '✓ MP4'; }
  catch(err){ alert(err.message || err); b.textContent = 'MP4'; }
  b.disabled = false;
});
</script>
